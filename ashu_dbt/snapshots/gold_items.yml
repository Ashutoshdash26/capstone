snapshots:
  - name: gold_items
    relation: ref('source_gold_items')
    config:
      schema: gold
      database: '{{ target.catalog }}'
      unique_key: id
      strategy: timestamp
      updated_at: Updatedate
      dbt_valid_to_current: "to_date('9999-12-31')" # Specifies that current records should have `dbt_valid_to` set to `'9999-12-31'` instead of `NULL`. 

  - name: gold_silver_snapshot
    relation: ref('source_silver')
    config:
      schema: gold
      database: '{{ target.catalog }}'
      unique_key: category
      strategy: check
      check_cols: all
      dbt_valid_to_current: "to_date('9999-12-31')" # Specifies that current records should have `dbt_valid_to` set to `'9999-12-31'` instead of `NULL`.